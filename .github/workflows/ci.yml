name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node is the runtime (Nest CLI, Vitest, Nitro); Bun installs and runs scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # One install for the whole Bun workspace; postinstall builds @ember/contracts.
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run --cwd packages/contracts typecheck

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node is the runtime (Nest CLI, Vitest, Nitro); Bun installs and runs scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # One install for the whole Bun workspace; postinstall builds @ember/contracts.
      - run: bun install --frozen-lockfile
      - run: bun run lint
        working-directory: apps/api
      - run: bun run build
        working-directory: apps/api
      - run: bun run test
        working-directory: apps/api
      - run: bun run test:e2e
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node is the runtime (Nest CLI, Vitest, Nitro); Bun installs and runs scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # One install for the whole Bun workspace; postinstall builds @ember/contracts.
      - run: bun install --frozen-lockfile
      - run: bun run lint
        working-directory: apps/web
      - run: bun run typecheck
        working-directory: apps/web
      - run: bun run test
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck :shared:testAndroidHostTest :androidApp:assembleDebug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
